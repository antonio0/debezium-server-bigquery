name: Publish Emma image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      image_tag:
        description: Image tag to publish
        required: true
        default: 0.11.0.final-emma.1
        type: string
      release_version:
        description: Maven release version embedded in the distribution
        required: true
        default: 0.11.0.final-emma.1
        type: string
  push:
    tags:
      - 'emma-*'

env:
  IMAGE_NAME: eu.gcr.io/emma-build/debezium-server-bigquery

jobs:
  build-and-push:
    if: github.repository == 'antonio0/debezium-server-bigquery'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            image_tag="$INPUT_IMAGE_TAG"
            release_version="$INPUT_RELEASE_VERSION"
          else
            image_tag="${GITHUB_REF_NAME#emma-}"
            release_version="$image_tag"
          fi

          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [[ ! "$image_tag" =~ $tag_pattern ]]; then
            echo "Invalid image tag: $image_tag" >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ $tag_pattern ]]; then
            echo "Invalid release version: $release_version" >&2
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          {
            echo "image_tag=$image_tag"
            echo "release_version=$release_version"
            echo "sha_tag=sha-${source_sha::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test project
        run: >-
          mvn -B --no-transfer-progress clean verify --file pom.xml
          -Drevision=${{ steps.release.outputs.release_version }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: eu.gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.release_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
